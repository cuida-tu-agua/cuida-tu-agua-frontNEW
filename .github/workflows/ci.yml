name: CI
on:
  pull_request:
    branches: [dev, main]

concurrency:                       # un push nuevo al PR cancela la corrida anterior
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Pruebas
        run: npx jest --ci
      - name: Lint (por ahora solo avisa)
        run: npm run lint
        continue-on-error: true