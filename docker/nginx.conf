server {
    listen 80;
    root /usr/share/nginx/html;

    # index.html must never be cached: it points to the current bundle
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app ("output": "single" in app.json): unknown paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
